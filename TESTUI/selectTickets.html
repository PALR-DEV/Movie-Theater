<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .ticket-counter {
            transition: all 0.2s ease;
        }
        
        .ticket-counter:active {
            transform: scale(0.95);
        }
        
        .summary-item {
            border-bottom: 1px solid #e5e7eb;
        }
        
        .summary-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- Header -->
        <header class="sticky top-0 z-10 bg-white border-b border-gray-200 px-4 py-3">
            <div class="flex items-center justify-between">
                <button class="p-2 rounded-full hover:bg-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <h1 class="text-lg font-semibold">Select Tickets</h1>
                <div class="w-10"></div> <!-- Spacer for balance -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 px-4 py-6">
            <!-- Movie Info -->
            <div class="mb-8">
                <div class="flex items-start space-x-4">
                    <div class="w-16 h-24 bg-gray-200 rounded-md overflow-hidden">
                        <img src="https://via.placeholder.com/64x96" alt="Movie Poster" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h2 class="font-bold text-lg">The Dark Knight</h2>
                        <p class="text-gray-600 text-sm">PG-13 • 2h 32m</p>
                        <div class="mt-2 flex items-center space-x-2">
                            <div class="px-2 py-1 bg-gray-100 rounded-full text-xs font-medium">IMAX</div>
                            <div class="px-2 py-1 bg-gray-100 rounded-full text-xs font-medium">Dolby</div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 grid grid-cols-2 gap-2">
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Date</p>
                        <p class="font-medium">Fri, Jun 10</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Time</p>
                        <p class="font-medium">7:30 PM</p>
                    </div>
                </div>
            </div>

            <!-- Ticket Selection -->
            <div class="mb-8">
                <h3 class="font-semibold mb-4">Select Tickets</h3>
                
                <!-- Adult Ticket -->
                <div class="bg-white border border-gray-200 rounded-lg p-4 mb-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-medium">Adult</p>
                            <p class="text-sm text-gray-600">$12.00</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('adult', -1)">
                                <i class="fas fa-minus text-gray-600 text-xs"></i>
                            </button>
                            <span id="adult-count" class="font-medium">0</span>
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('adult', 1)">
                                <i class="fas fa-plus text-gray-600 text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Child Ticket -->
                <div class="bg-white border border-gray-200 rounded-lg p-4 mb-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-medium">Child (Under 12)</p>
                            <p class="text-sm text-gray-600">$8.00</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('child', -1)">
                                <i class="fas fa-minus text-gray-600 text-xs"></i>
                            </button>
                            <span id="child-count" class="font-medium">0</span>
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('child', 1)">
                                <i class="fas fa-plus text-gray-600 text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Senior Ticket -->
                <div class="bg-white border border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-medium">Senior (65+)</p>
                            <p class="text-sm text-gray-600">$9.00</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('senior', -1)">
                                <i class="fas fa-minus text-gray-600 text-xs"></i>
                            </button>
                            <span id="senior-count" class="font-medium">0</span>
                            <button class="ticket-counter w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center" onclick="updateTicketCount('senior', 1)">
                                <i class="fas fa-plus text-gray-600 text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <h3 class="font-semibold mb-3">Order Summary</h3>
                
                <div class="space-y-3 mb-4">
                    <div class="summary-item pb-3">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Adult x <span id="summary-adult">0</span></span>
                            <span>$<span id="summary-adult-price">0.00</span></span>
                        </div>
                    </div>
                    <div class="summary-item pb-3">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Child x <span id="summary-child">0</span></span>
                            <span>$<span id="summary-child-price">0.00</span></span>
                        </div>
                    </div>
                    <div class="summary-item pb-3">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Senior x <span id="summary-senior">0</span></span>
                            <span>$<span id="summary-senior-price">0.00</span></span>
                        </div>
                    </div>
                </div>
                
                <div class="border-t border-gray-200 pt-3">
                    <div class="flex justify-between font-medium">
                        <span>Total</span>
                        <span>$<span id="total-price">0.00</span></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer/Checkout Button -->
        <footer class="sticky bottom-0 bg-white border-t border-gray-200 px-4 py-3">
            <button id="checkout-btn" class="w-full bg-black text-white py-3 rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Continue to Checkout
            </button>
        </footer>
    </div>

    <script>
        // Ticket prices
        const prices = {
            adult: 12.00,
            child: 8.00,
            senior: 9.00
        };
        
        // Ticket counts
        let tickets = {
            adult: 0,
            child: 0,
            senior: 0
        };
        
        // Update ticket count
        function updateTicketCount(type, change) {
            const newCount = tickets[type] + change;
            
            // Ensure count doesn't go below 0
            if (newCount >= 0) {
                tickets[type] = newCount;
                document.getElementById(`${type}-count`).textContent = newCount;
                
                // Update summary
                updateSummary();
            }
        }
        
        // Update the order summary
        function updateSummary() {
            // Update counts in summary
            document.getElementById('summary-adult').textContent = tickets.adult;
            document.getElementById('summary-child').textContent = tickets.child;
            document.getElementById('summary-senior').textContent = tickets.senior;
            
            // Calculate prices
            const adultPrice = (tickets.adult * prices.adult).toFixed(2);
            const childPrice = (tickets.child * prices.child).toFixed(2);
            const seniorPrice = (tickets.senior * prices.senior).toFixed(2);
            const totalPrice = (parseFloat(adultPrice) + parseFloat(childPrice) + parseFloat(seniorPrice)).toFixed(2);
            
            // Update prices in summary
            document.getElementById('summary-adult-price').textContent = adultPrice;
            document.getElementById('summary-child-price').textContent = childPrice;
            document.getElementById('summary-senior-price').textContent = seniorPrice;
            document.getElementById('total-price').textContent = totalPrice;
            
            // Enable/disable checkout button based on ticket count
            const checkoutBtn = document.getElementById('checkout-btn');
            const totalTickets = tickets.adult + tickets.child + tickets.senior;
            
            if (totalTickets > 0) {
                checkoutBtn.disabled = false;
            } else {
                checkoutBtn.disabled = true;
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateSummary();
            
            // Add click handler for checkout button
            document.getElementById('checkout-btn').addEventListener('click', () => {
                alert(`Proceeding to checkout with ${tickets.adult} adult, ${tickets.child} child, and ${tickets.senior} senior tickets. Total: $${document.getElementById('total-price').textContent}`);
                // In a real app, this would redirect to the checkout page
            });
        });
    </script>
</body>
</html>
